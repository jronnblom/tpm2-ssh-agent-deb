name: Build Debian Packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional upstream ssh-tpm-agent tag (for example v0.9.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="$(./scripts/get-latest-version.sh)"
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Build matrix from versions.conf
        id: matrix
        run: |
          matrix_json="$(python3 - <<'PY'
import json
entries = []
with open('versions.conf', encoding='utf-8') as f:
    for raw in f:
        line = raw.strip()
        if not line or line.startswith('#'):
            continue
        parts = line.split()
        if len(parts) < 2:
            continue
        entries.append({'ubuntu': parts[0], 'go_version': parts[1]})
print(json.dumps(entries))
PY
)"
          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package image
        run: |
          docker build \
            --build-arg UBUNTU_VERSION="${{ matrix.ubuntu }}" \
            --build-arg GO_VERSION="${{ matrix.go_version }}" \
            --build-arg SSH_TPM_AGENT_VERSION="${{ needs.prepare.outputs.release_tag }}" \
            -t "ssh-tpm-agent-deb:${{ matrix.ubuntu }}" .

      - name: Extract deb files
        run: |
          mkdir -p output
          container="ssh-tpm-agent-deb-${{ matrix.ubuntu }}"
          docker rm -f "$container" >/dev/null 2>&1 || true
          docker create --name "$container" "ssh-tpm-agent-deb:${{ matrix.ubuntu }}"
          docker cp "$container:/output/." output/
          docker rm -f "$container"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-ubuntu-${{ matrix.ubuntu }}
          path: output/*.deb

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: debs-ubuntu-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deb-${{ needs.prepare.outputs.release_tag }}
          name: ssh-tpm-agent deb packages ${{ needs.prepare.outputs.release_tag }}
          files: artifacts/*.deb
          overwrite_files: true
          generate_release_notes: true
